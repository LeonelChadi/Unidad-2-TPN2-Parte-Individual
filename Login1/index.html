<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login & Registration Form | HTML & CSS</title>

    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <input type="checkbox" id="check" />

      <!-- Formulario de Iniciar Sesión -->
      <div class="form-box login">
        <h2>Ingresar</h2>
        <form action="#">
          <div class="input-box">
            <input type="text" required />
            <label>Usuario</label>
            <i class="bx bxs-user"></i>
          </div>
          <div class="input-box">
            <input type="password" required />
            <label>Contraseña</label>
            <i class="bx bxs-lock-alt"></i>
          </div>
          <div class="remember-forgot">
            <label><input type="checkbox" /> Recuérdame</label>
            <a href="#">¿Olvidaste tu clave?</a>
          </div>
          <button type="submit" class="btn">Acceder</button>
          <div class="login-register">
            <p>¿No tienes una cuenta? <label for="check">Regístrate</label></p>
          </div>
        </form>
      </div>

      <!-- Formulario de Registro -->
      <div class="form-box register">
        <h2>Registro</h2>
        <form action="#">
          <div class="input-box">
            <input type="text" required />
            <label>Usuario</label>
            <i class="bx bxs-user"></i>
          </div>
          <div class="input-box">
            <input type="email" required />
            <label>Correo Electrónico</label>
            <i class="bx bxs-envelope"></i>
          </div>
          <div class="input-box">
            <input type="password" required />
            <label>Contraseña</label>
            <i class="bx bxs-lock-alt"></i>
          </div>
          <div class="remember-forgot">
            <label
              ><input type="checkbox" required /> Acepto los términos</label
            >
          </div>
          <button type="submit" class="btn">Crear cuenta</button>
          <div class="login-register">
            <p>
              ¿Ya tienes una cuenta? <label for="check">Inicia Sesión</label>
            </p>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
